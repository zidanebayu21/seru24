# Konfigurasi SonarQube untuk seru24 (web + mobile). Jalankan dari root repo: sonar-scanner -Dsonar.host.url=<url>
# dengan SONAR_TOKEN di environment (jangan simpan token di file ini).
sonar.projectKey=seru24
sonar.projectName=seru24
sonar.sourceEncoding=UTF-8

# Kode aplikasi
sonar.sources=web/app,web/server,web/shared,mobile/src

# Test: web/test (struktur folder sama dengan kode yang diuji) dan mobile/__tests__
sonar.tests=web/test,mobile/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Coverage: web -> `npm run test:coverage` di web/, mobile -> `npx jest --coverage` di mobile/
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,mobile/coverage/lcov.info

sonar.exclusions=**/node_modules/**,web/.nuxt/**,web/.output/**,web/coverage/**,mobile/coverage/**,mobile/android/**,mobile/ios/**,**/*.apk
sonar.coverage.exclusions=web/app/**,web/server/api/**,mobile/src/screens/**,mobile/src/components/**,mobile/src/App.tsx
