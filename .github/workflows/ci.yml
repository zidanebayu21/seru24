name: CI

# Test dan build di setiap push dan pull request, supaya kerusakan kecil (import yang lupa, nama class bentrok)
# tertangkap sebelum sampai ke production. Tidak butuh secret.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # src/env.ts dibuat dari .env saat build dan tidak ada di git; test yang mengimpor kode aplikasi membutuhkannya.
      # Nilai di sini hanya contoh untuk CI (bukan rahasia).
      - name: Buat src/env.ts
        run: |
          {
            echo "SUPABASE_URL=https://example.supabase.co"
            echo "SUPABASE_ANON_KEY=ci-test-key"
            echo "API_BASE_URL=https://example.test"
          } > .env
          node scripts/gen-env.js
      - run: npx jest
