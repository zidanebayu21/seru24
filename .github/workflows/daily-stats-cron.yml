name: Daily Stats & DB Prune

on:
  schedule:
    # 01:00 UTC = 08:00 WIB setiap Senin dan Kamis
    - cron: '0 1 * * 1,4'
  workflow_dispatch:

jobs:
  trigger-daily-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Call seru24 daily-stats endpoint
        env:
          SERU24_URL: ${{ secrets.SERU24_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE_URL="${SERU24_URL:-https://seru24.vercel.app}"
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET belum diset di repo"
            exit 1
          fi
          # Repo publik: log Actions bisa dibaca siapa saja, jadi isi laporan tidak dicetak, hanya status HTTP.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/daily-stats")
          echo "HTTP $code"
          [ "$code" = "200" ]
