[target.aarch64-linux-android]
rustflags = [
    "-C", "force-unwind-tables=no",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--icf=all",
    "-C", "link-arg=-Wl,--pack-dyn-relocs=android+relr",
    "-C", "link-arg=-Wl,--strip-all",
]

[target.x86_64-linux-android]
rustflags = [
    "-C", "force-unwind-tables=no",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--icf=all",
    "-C", "link-arg=-Wl,--pack-dyn-relocs=android+relr",
    "-C", "link-arg=-Wl,--strip-all",
]
