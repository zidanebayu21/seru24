plugins {
    id("com.android.application")
}

def targetAbi = project.findProperty("seruAbi") ?: "arm64-v8a"
def forceDebugSign = (project.findProperty("seruSigning") ?: "") == "debug"

def keystorePropertiesFile = file("../../../mobile/android/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "id.seru24.chat.rust"
    compileSdk = 37
    buildToolsVersion = "37.0.0"

    defaultConfig {
        applicationId = "id.seru24.chat.rust"
        minSdk = 29
        targetSdk = 36
        versionCode = 3
        versionName = "0.1.3"
        ndk {
            abiFilters.clear()
            abiFilters.add(targetAbi)
        }
    }

    signingConfigs {
        debug {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        release {
            if (keystoreProperties["storeFile"]) {
                storeFile = file("../../../mobile/android/app/" + keystoreProperties["storeFile"])
                if (!storeFile.exists()) {
                    storeFile = file("../../../mobile/android/" + keystoreProperties["storeFile"])
                }
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = (!forceDebugSign && keystoreProperties["storeFile"]) ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                "META-INF/*.kotlin_module",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "kotlin/**",
                "**/*.kotlin_builtins",
                "DebugProbesKt.bin"
            ]
        }
    }
}

dependencies {
    implementation("androidx.core:core:1.13.1")
    implementation(platform("com.google.firebase:firebase-bom:33.10.0"))
    implementation("com.google.firebase:firebase-messaging")
    implementation("com.google.android.gms:play-services-nearby:19.3.0")
    implementation("org.jitsi:webrtc:155.0.1")
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
